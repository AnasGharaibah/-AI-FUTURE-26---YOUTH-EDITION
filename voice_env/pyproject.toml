[project]
name = "voice-env"
version = "0.1.0"
description = "Isolated OmniVoice TTS worker (OmniVoice pins torch 2.8.0; the main project uses torch 2.14)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omnivoice",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile",
    "numpy",
    "fastapi",
    "uvicorn",
]

# NVIDIA GPU: the CUDA 12.8 builds of torch / torchaudio 2.8.0 (OmniVoice's documented setup)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
