<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verity</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2275%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fff%22/%3E%3Cstop%20offset%3D%22.18%22%20stop-color%3D%22%239DD8FF%22/%3E%3Cstop%20offset%3D%22.45%22%20stop-color%3D%22%235B6BFF%22/%3E%3Cstop%20offset%3D%22.75%22%20stop-color%3D%22%239B4DFF%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F04FD0%22/%3E%3C/radialGradient%3E%3CradialGradient%20id%3D%22h%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2250%25%22%3E%3Cstop%20offset%3D%22.7%22%20stop-color%3D%22%232F6BFF%22%20stop-opacity%3D%22.6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232F6BFF%22%20stop-opacity%3D%220%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2231%22%20fill%3D%22url%28%23h%29%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2224%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E">
<style>
:root{--bg:#F4F5FB;--panel:#fff;--side:#EBEDF8;--ink:#14142B;--mute:#6B6B88;--line:#E1E3F2;--acc:#3B35E8;--onacc:#fff;--hl:#FFE066;--onhl:#14142B;--shadow:0 12px 36px rgba(59,53,232,.12);--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0D0E1B;--panel:#16182F;--side:#121428;--ink:#ECECFA;--mute:#9A9BBA;--line:#262947;--acc:#8E89FF;--onacc:#0D0E1B;--shadow:0 12px 36px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template-columns:288px 1fr;height:100vh}
#app.split{grid-template-columns:288px minmax(380px,1fr) minmax(420px,1.1fr)}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mute)}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
/* sidebar */
#side{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font:30px/1 var(--serif);padding:0 6px}
.orb{width:26px;height:26px;border-radius:50%;background:var(--acc)}
.primary{background:var(--acc);color:var(--onacc);border:0;border-radius:14px;height:46px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.newChatSide{height:44px;border:1px solid var(--line);background:var(--panel);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;text-align:left;box-shadow:0 4px 14px rgba(20,20,43,.04)}
.newChatSide:hover{border-color:var(--acc);transform:translateY(-1px)}
.newChatPlus{width:25px;height:25px;border-radius:9px;background:var(--side);display:inline-flex;align-items:center;justify-content:center;color:var(--acc);font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:0 6px;color:var(--mute);font-size:13px}
#lib{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.item,.fhead{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px}
.item:hover,.fhead:hover{background:var(--panel)}
.on>.fhead,.item.on{background:var(--panel);box-shadow:inset 0 0 0 1px var(--acc)}
.folder{border-radius:12px}.folder.over{box-shadow:0 0 0 2px var(--acc);background:var(--panel)}
.fname{flex:1;text-align:left;border:0;background:transparent;font-weight:600;padding:0}
.cnt{color:var(--mute);font-size:12px}
.x{border:0;background:transparent;color:var(--mute);border-radius:6px;width:24px;height:24px;opacity:0}
.fhead:hover .x,.doc:hover .x,.x:focus-visible{opacity:1}
.doc{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 22px;border-radius:8px;font-size:13px;color:var(--mute)}
.doc:hover{background:var(--panel);color:var(--ink)}
.doc.on{background:var(--panel);box-shadow:inset 0 0 0 1px var(--acc);color:var(--ink)}
.doc .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:left;padding:0;color:inherit}
.scopeDoc{border:0;background:transparent;color:var(--mute);border-radius:7px;padding:2px 6px;font-size:14px}
.scopeDoc:hover,.doc.on .scopeDoc{color:var(--acc);background:var(--panel)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* chat */
#chat{display:flex;flex-direction:column;min-width:0;height:100vh;padding:20px 32px 24px}
#chat>header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topLeft,.topRight{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.heroGlow{position:relative}
.heroGlow::after{content:"";position:absolute;inset:-12px;border-radius:32px;background:radial-gradient(circle at 50% 20%,rgba(59,53,232,.12),transparent 65%);z-index:-1;pointer-events:none}

#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:22px;padding:24px 0;scroll-behavior:smooth}
.m{max-width:760px;width:100%;margin:0 auto}
.user{align-self:flex-end;margin-left:auto;max-width:520px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:20px 20px 6px 20px;unicode-bidi:plaintext;text-align:start}
.bot{font:24px/1.5 var(--serif);white-space:pre-wrap;unicode-bidi:plaintext;text-align:start}
.bot.typing::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-left:6px;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.bot.typing::after{animation:none}}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:var(--acc);color:var(--onacc);font:600 12px var(--sans);border:0;vertical-align:3px;margin:0 2px;padding:0 5px}
.found{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font:14px var(--sans);color:var(--mute)}
.src{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--acc);font-weight:500}
.src:hover{border-color:var(--acc)}
.warn{font:15px var(--sans);color:var(--mute)}
#empty{margin:auto;text-align:center;max-width:620px;display:flex;flex-direction:column;gap:14px;align-items:center}
#empty h1{font:400 56px/1.05 var(--serif);margin:0}
#empty p{color:var(--mute);margin:0}
.intro{max-width:680px;font-size:16px;line-height:1.65}
.caps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:6px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;color:var(--mute);font-size:13px}
.cap strong{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
@media(max-width:680px){.caps{grid-template-columns:1fr}}
.drop{width:100%;border:2px dashed var(--line);border-radius:22px;padding:34px;background:var(--panel)}
#form{max-width:760px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:34px;padding:8px 8px 8px 26px;box-shadow:var(--shadow)}
#q{flex:1;border:0;background:transparent;color:var(--ink);font:17px var(--sans);height:44px}
#q:focus-visible{outline:0}
.go{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:20px;display:flex;align-items:center;justify-content:center}
.go.stop{background:#D84A4A;color:#fff;font-size:16px}
/* viewer */
#viewer{background:var(--side);border-left:1px solid var(--line);padding:20px 28px 0;display:flex;flex-direction:column;gap:14px;min-width:0;height:100vh}
#viewer[hidden]{display:none}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#vtitle{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#paper{flex:1;overflow:auto;background:var(--panel);border-radius:14px 14px 0 0;padding:44px 52px;font:17px/1.8 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);unicode-bidi:plaintext;text-align:start}
#orig{flex:1;border:0;border-radius:14px 14px 0 0;background:#fff;width:100%;box-shadow:var(--shadow)}
#orig[hidden]{display:none}
mark{background:var(--hl);color:var(--onhl);border-radius:4px;padding:1px 3px;position:relative}
mark::before{content:"Answer";display:inline-block;margin-right:6px;vertical-align:1px;background:var(--acc);color:var(--onacc);font:600 10px var(--sans);letter-spacing:.02em;padding:1px 7px;border-radius:99px;white-space:nowrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);max-width:560px;white-space:pre-wrap}
#toast[hidden]{display:none}
#voiceDock{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#voiceFab{width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:24px;box-shadow:0 14px 34px rgba(59,53,232,.28)}
#voiceFab.active{animation:voicePulse 1.4s infinite}
#voicePanel{width:270px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
#voicePanel[hidden]{display:none}
.voiceHead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.voiceOrb{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px rgba(59,53,232,.08)}
#voiceStatus{font-size:13px;color:var(--mute);margin-bottom:10px}
.voiceLangRow{display:flex;gap:6px}
.voiceLang{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 10px;font-size:12px;color:var(--mute)}
.voiceLang.on{border-color:var(--acc);color:var(--acc);background:rgba(59,53,232,.07)}
.voiceHint{font-size:11px;color:var(--mute);margin-top:9px}
@keyframes voicePulse{0%{box-shadow:0 0 0 0 rgba(59,53,232,.35)}70%{box-shadow:0 0 0 16px rgba(59,53,232,0)}100%{box-shadow:0 0 0 0 rgba(59,53,232,0)}}
.answerTools{display:flex;gap:8px;align-items:center;margin-top:10px;font:13px var(--sans);color:var(--mute);flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:9px;padding:5px 9px;font-size:12px}
.mini:hover{border-color:var(--acc);color:var(--ink)}
.trustPanel{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;font:13px/1.5 var(--sans)}
.trustPanel[hidden]{display:none}
.traceTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.traceTable th,.traceTable td{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;font:12px var(--sans);border:1px solid var(--line)}
.badge.good{background:rgba(50,160,90,.10)}
.badge.weak{background:rgba(220,165,45,.12)}
.badge.bad{background:rgba(210,75,75,.10)}
.conflict{margin-top:9px;padding:9px 11px;border-radius:10px;background:rgba(220,165,45,.13);font:13px var(--sans)}
#voiceLang{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:10px;padding:0 6px;height:34px}
.mic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:17px}
.mic.listening{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#voiceLangSelect{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:10px;padding:0 7px;height:34px;font-size:12px}
@media(max-width:900px){#app,#app.split{grid-template-columns:1fr}#side,#viewer{display:none}#app.split #viewer{display:flex;position:fixed;inset:0;z-index:5}}

[hidden]{display:none!important}
#app.collapsed{grid-template-columns:0 minmax(0,1fr)}
#app.collapsed.split{grid-template-columns:0 minmax(320px,1fr) minmax(360px,1.1fr)}
#app.collapsed #side{visibility:hidden;padding:0;border:0}
.star{border:0;background:transparent;color:var(--acc);font-size:18px;padding:2px}
#suggestBox{max-width:760px;width:100%;margin:0 auto 8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:220px;overflow:auto}
#suggestBox button{display:block;width:100%;text-align:start;background:transparent;border:0;padding:9px 16px}
#suggestBox button:hover,#suggestBox button[aria-selected=true]{background:var(--side)}
#paper.slide{flex:none;aspect-ratio:16/9;width:100%;padding:24px 32px;border-radius:14px;font:clamp(14px,1.5vw,22px)/1.6 var(--sans);overflow:auto;margin-block:auto;white-space:pre-wrap}
#paper.slide .slideHeading{font-size:1.35em;font-weight:700;display:block;margin-bottom:12px}
#paper[hidden]{display:none}#q{min-width:0}#uiLang{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px}
[dir=rtl] #side{border-right:0;border-left:1px solid var(--line)}
[dir=rtl] #viewer{border-left:0;border-right:1px solid var(--line)}
[dir=rtl] .item,[dir=rtl] .fname,[dir=rtl] .nm,[dir=rtl] .cap,[dir=rtl] .newChatSide,[dir=rtl] .traceTable th,[dir=rtl] .traceTable td{text-align:start}
[dir=rtl] #voiceDock{right:auto;left:24px}
[dir=rtl] .doc{padding:6px 22px 6px 10px}
[dir=rtl] mark::before{content:"الدليل";margin-right:0;margin-left:6px}
@media(max-width:900px){#app.collapsed,#app.collapsed.split{grid-template-columns:1fr}#app:not(.collapsed) #side{display:flex;position:fixed;inset-block:0;inset-inline-start:0;width:288px;z-index:40;box-shadow:var(--shadow)}#chat{padding:16px}#paper.slide{font-size:16px}}

#chatList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.savedChat{display:flex;align-items:center;gap:4px;padding:8px;border-radius:10px}
.savedChat.active,.savedChat:hover{background:var(--panel)}
.chatTitle{flex:1;min-width:0;text-align:start;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;background:none;border:0;padding:5px;color:inherit}
.chatAction{background:none;border:0;color:var(--mute);padding:4px;font-size:16px}
.chatEmpty,.archiveFilter{font-size:13px;color:var(--mute);padding:6px}
.archiveFilter{display:flex;align-items:center;gap:7px}
#libraryPanel{position:fixed;inset-block:12px;inset-inline-end:12px;width:min(420px,calc(100vw - 24px));display:flex;flex-direction:column;gap:14px;background:var(--side);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);z-index:45}
#libraryPanel #lib{min-height:0}

#documentActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
#documentActions button:disabled{opacity:.45;cursor:not-allowed}
#actionDocName{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--mute);unicode-bidi:plaintext}

#folderDialog{width:min(440px,calc(100vw - 32px));border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#folderDialog::backdrop{background:rgba(15,17,40,.48);backdrop-filter:blur(4px)}
.folderModalHead{display:flex;align-items:center;justify-content:space-between}
.folderModalIcon{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:15px;background:var(--side);color:var(--acc);font-size:26px}
#folderDialog h2{font-size:24px;margin:18px 0 6px}#folderDialog p{color:var(--mute);font-size:14px;margin:0 0 22px}#folderDialog label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
#folderName{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
#folderName[aria-invalid=true]{border-color:#d84a4a}#folderError{color:#d84a4a;font-size:13px;margin-top:8px}
.folderModalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.folderModalActions button{padding:10px 20px;border-radius:12px}
/* =====================================================================
   VERITY "AURORA ORB" THEME  —  style layer only, no features changed
   Vibe: glowing AI orb + light-ribbon voice wave on deep space black
   ===================================================================== */
[data-theme=dark]{--bg:#03040B;--panel:rgba(17,20,46,.58);--side:rgba(7,9,24,.66);--ink:#EEF0FF;--mute:#8E95C7;--line:rgba(130,145,255,.16);--acc:#5B8CFF;--onacc:#fff;--hl:rgba(255,181,71,.24);--onhl:#FFE6B8;--shadow:0 22px 60px rgba(0,0,0,.6);--solid:#0A0C1F;--fx1:rgba(40,100,255,.30);--fx2:rgba(123,77,255,.24);--fx3:rgba(240,79,208,.13);--star:rgba(255,255,255,.7);--glassHi:rgba(255,255,255,.06)}
[data-theme=light]{--bg:#F3F4FF;--panel:rgba(255,255,255,.74);--side:rgba(255,255,255,.55);--ink:#11132E;--mute:#626893;--line:rgba(70,80,190,.14);--acc:#3D5BFF;--onacc:#fff;--hl:rgba(255,181,71,.42);--onhl:#3A2500;--shadow:0 18px 50px rgba(60,70,200,.14);--solid:#fff;--fx1:rgba(47,107,255,.17);--fx2:rgba(123,77,255,.15);--fx3:rgba(240,79,208,.10);--star:rgba(70,80,190,.22);--glassHi:rgba(255,255,255,.7)}
:root{--g1:#2F6BFF;--g2:#7B4DFF;--g3:#F04FD0;--g4:#FFB547;--g5:#2FE0FF;
  --grad:linear-gradient(120deg,var(--g1),var(--g2) 45%,var(--g3) 80%,var(--g4));
  --gradCool:linear-gradient(135deg,var(--g1),var(--g2));
  --sans:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Arabic","Segoe UI Arabic",sans-serif}

/* ---------- cosmic background: glow fields + drifting particles ---------- */
html{background:var(--bg)}
body{background:transparent;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 42% at 18% 12%,var(--fx1),transparent 70%),
             radial-gradient(34% 40% at 88% 92%,var(--fx2),transparent 70%),
             radial-gradient(28% 30% at 70% 30%,var(--fx3),transparent 70%),
             radial-gradient(30% 34% at 10% 90%,var(--fx2),transparent 70%);
  animation:auroraDrift 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,var(--star),transparent 60%),radial-gradient(1.5px 1.5px at 72% 64%,var(--star),transparent 60%),
    radial-gradient(1px 1px at 38% 82%,var(--star),transparent 60%),radial-gradient(1.2px 1.2px at 86% 22%,var(--star),transparent 60%),
    radial-gradient(1px 1px at 55% 40%,var(--star),transparent 60%),radial-gradient(2px 2px at 24% 56%,rgba(120,160,255,.6),transparent 60%),
    radial-gradient(2px 2px at 64% 12%,rgba(255,170,90,.5),transparent 60%),radial-gradient(1.6px 1.6px at 92% 78%,rgba(240,79,208,.5),transparent 60%);
  background-size:420px 420px,560px 560px,380px 380px,640px 640px,300px 300px,720px 720px,820px 820px,520px 520px;
  animation:starDrift 90s linear infinite}
@keyframes auroraDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-2%,0) scale(1.06)}100%{transform:translate3d(-3%,2%,0) scale(1.02)}}
@keyframes starDrift{to{background-position:420px -420px,-560px 560px,380px 380px,-640px -640px,300px -300px,720px 720px,-820px 820px,520px -520px}}

/* ---------- shared orb recipe ---------- */
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbSpinBack{to{transform:rotate(-360deg)}}
@keyframes orbBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
@keyframes gradShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.orb{position:relative;width:30px;height:30px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 7%,transparent 26%),
             radial-gradient(circle at 72% 70%,rgba(240,79,208,.9),transparent 48%),
             radial-gradient(circle at 24% 76%,rgba(47,224,255,.85),transparent 46%),
             conic-gradient(from 0deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));
  box-shadow:0 0 18px rgba(70,120,255,.75),0 0 40px rgba(123,77,255,.35),inset 0 0 8px rgba(255,255,255,.4);
  animation:orbSpin 9s linear infinite}
.brand{font:700 28px/1 var(--sans);letter-spacing:-.03em;gap:12px}

/* ---------- glass surfaces ---------- */
#side{background:var(--side);border-color:var(--line);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
#viewer{background:var(--side);border-color:var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#libraryPanel,#voicePanel,#suggestBox,#selectMenu,#folderDialog,.trustPanel{background:var(--panel);border-color:var(--line);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 var(--glassHi)}
#folderDialog,#selectMenu,#suggestBox{background:color-mix(in srgb,var(--solid) 86%,transparent)}
select,select option{background:var(--solid);color:var(--ink)}
.pill,.ghost,.mini,#uiLang,#voiceLangSelect{background:var(--panel);border-color:var(--line);color:var(--mute);backdrop-filter:blur(12px);transition:all .2s}
.ghost:hover,.mini:hover{color:var(--ink);border-color:rgba(91,140,255,.55);box-shadow:0 0 0 3px rgba(91,140,255,.12),0 0 18px rgba(91,140,255,.18)}
#scope{border-color:rgba(91,140,255,.35);color:var(--ink);box-shadow:0 0 16px rgba(91,140,255,.15)}
#scope::before{content:"";width:7px;height:7px;border-radius:50%;margin-inline-end:8px;background:var(--g5);box-shadow:0 0 10px var(--g5);animation:haloPulse 2.4s ease-in-out infinite}
.newChatSide{background:var(--panel);border-color:var(--line);box-shadow:inset 0 1px 0 var(--glassHi);transition:all .2s}
.newChatSide:hover{border-color:transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,var(--grad) border-box;box-shadow:0 0 24px rgba(123,77,255,.3)}
.newChatPlus{background:var(--gradCool);color:#fff;box-shadow:0 0 12px rgba(70,120,255,.55)}
.savedChat{transition:background .2s}
.savedChat.active{background:linear-gradient(90deg,rgba(47,107,255,.18),rgba(123,77,255,.06));box-shadow:inset 2px 0 0 var(--g1)}
[dir=rtl] .savedChat.active{box-shadow:inset -2px 0 0 var(--g1);background:linear-gradient(270deg,rgba(47,107,255,.18),rgba(123,77,255,.06))}
.item:hover,.fhead:hover,.doc:hover,.savedChat:hover{background:rgba(91,140,255,.09)}
.on>.fhead,.item.on,.doc.on{background:rgba(91,140,255,.12);box-shadow:inset 0 0 0 1px rgba(91,140,255,.45)}
#documentActions{border-color:var(--line)}

/* ---------- primary actions: aurora gradient ---------- */
.primary{background:var(--grad);background-size:200% 100%;color:#fff;box-shadow:0 10px 30px rgba(123,77,255,.38),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s;animation:gradShift 8s linear infinite}
.primary:hover{transform:translateY(-1px);box-shadow:0 14px 40px rgba(240,79,208,.4),inset 0 1px 0 rgba(255,255,255,.35);filter:none}
.go{background:var(--grad);background-size:200% 100%;color:#fff;box-shadow:0 0 22px rgba(91,110,255,.6),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s,box-shadow .2s;animation:gradShift 6s linear infinite}
.go:hover{transform:scale(1.07);box-shadow:0 0 34px rgba(240,79,208,.6)}
.go.stop{background:linear-gradient(135deg,#FF5A7A,#D8345A);animation:none;box-shadow:0 0 22px rgba(255,90,122,.55)}
.mic{border-color:var(--line);color:var(--ink);transition:all .2s}
.mic:hover{border-color:rgba(91,140,255,.6);box-shadow:0 0 16px rgba(91,140,255,.3)}
.mic.listening{background:var(--gradCool);border-color:transparent;color:#fff;animation:micGlow 1.2s ease-in-out infinite}
@keyframes micGlow{0%,100%{box-shadow:0 0 0 0 rgba(47,224,255,.5)}50%{box-shadow:0 0 0 9px rgba(47,224,255,0),0 0 26px rgba(91,140,255,.7)}}

/* ---------- composer: glass capsule with glowing gradient rim ---------- */
#form{position:relative;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,rgba(91,140,255,.45),rgba(123,77,255,.25),rgba(240,79,208,.35)) border-box;border:1px solid transparent;backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:var(--shadow),0 0 40px rgba(70,110,255,.14);transition:box-shadow .3s}
#form:focus-within{box-shadow:var(--shadow),0 0 0 4px rgba(91,140,255,.12),0 0 60px rgba(123,77,255,.32)}
#q::placeholder{color:var(--mute)}

/* ---------- empty state hero: the thinking sphere ---------- */
#empty{gap:16px}
#empty::before{content:"";width:150px;height:150px;border-radius:50%;margin-bottom:10px;flex:none;
  background:radial-gradient(circle at 50% 50%,transparent 52%,rgba(120,170,255,.55) 64%,transparent 70%),
             radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 4%,transparent 20%),
             radial-gradient(circle at 66% 66%,rgba(240,79,208,.85),transparent 42%),
             radial-gradient(circle at 30% 70%,rgba(47,224,255,.8),transparent 40%),
             radial-gradient(circle at 70% 30%,rgba(255,181,71,.55),transparent 34%),
             conic-gradient(from 90deg,#1A3DFF,#6A3BFF,#F04FD0,#2FE0FF,#1A3DFF);
  box-shadow:0 0 50px rgba(47,107,255,.75),0 0 120px rgba(123,77,255,.45),0 0 200px rgba(47,107,255,.25),inset 0 0 30px rgba(255,255,255,.35),inset 0 -18px 40px rgba(10,20,90,.6);
  animation:orbSpin 14s linear infinite}
.heroGlow::after{inset:-80px -40px auto;height:340px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(47,107,255,.32),rgba(123,77,255,.12) 40%,transparent 68%);filter:blur(10px);animation:haloPulse 6s ease-in-out infinite}
#empty h1{font:700 54px/1.05 var(--sans);letter-spacing:-.045em;background:linear-gradient(110deg,var(--ink) 20%,#9DB6FF 45%,#C9A6FF 60%,#FFC98A 80%,var(--ink));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 10s linear infinite}
[dir=rtl] #empty h1{letter-spacing:0}
.intro{color:var(--mute)}
.cap{position:relative;background:var(--panel);border-color:var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 var(--glassHi);transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.cap::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--grad);opacity:.0;transition:opacity .25s}
.cap:hover{transform:translateY(-3px);border-color:rgba(123,77,255,.45);box-shadow:0 16px 40px rgba(47,107,255,.2),inset 0 1px 0 var(--glassHi)}
.cap:hover::before{opacity:1}
.cap strong{font-weight:650}
.cap strong::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:8px;vertical-align:1px;background:var(--grad);box-shadow:0 0 10px rgba(123,77,255,.8)}
.drop{background:var(--panel);border-color:rgba(91,140,255,.35);backdrop-filter:blur(16px)}

/* ---------- messages ---------- */
.user{background:var(--gradCool);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(47,107,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.bot{font:400 19px/1.7 var(--sans);letter-spacing:-.005em}
.bot.typing::after{background:var(--grad);box-shadow:0 0 12px rgba(123,77,255,.9);width:10px;height:10px}
.cite{background:var(--gradCool);color:#fff;box-shadow:0 0 12px rgba(70,120,255,.55);transition:transform .15s}
.cite:hover{transform:translateY(-1px) scale(1.08)}
.src{background:var(--panel);border-color:rgba(91,140,255,.35);color:var(--ink);backdrop-filter:blur(12px);transition:all .2s}
.src:hover{border-color:transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,var(--grad) border-box;box-shadow:0 0 22px rgba(123,77,255,.35)}
.badge{border-color:var(--line)}

/* ---------- document viewer ---------- */
#paper{background:color-mix(in srgb,var(--solid) 92%,transparent);border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow),inset 0 1px 0 var(--glassHi);font:17px/1.85 var(--sans)}
mark{background:var(--hl);color:var(--onhl);box-shadow:0 0 0 1px rgba(255,181,71,.55),0 0 22px rgba(255,181,71,.35);border-radius:5px}
mark::before{background:linear-gradient(135deg,var(--g4),var(--g3));color:#fff;box-shadow:0 0 10px rgba(255,140,80,.55)}
#toast{background:color-mix(in srgb,var(--solid) 90%,transparent);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(20px);box-shadow:var(--shadow),0 0 30px rgba(91,140,255,.2)}
.star{color:var(--g4);text-shadow:0 0 10px rgba(255,181,71,.6)}

/* ---------- voice: floating orb button ---------- */
#voiceFab{position:relative;isolation:isolate;width:66px;height:66px;background:transparent;color:#fff;font-size:22px;box-shadow:0 0 30px rgba(47,107,255,.65),0 0 70px rgba(123,77,255,.35);transition:transform .25s}
#voiceFab::before,#voiceFab::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1}
#voiceFab::before{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 6%,transparent 24%),radial-gradient(circle at 70% 72%,rgba(240,79,208,.85),transparent 46%),radial-gradient(circle at 26% 74%,rgba(47,224,255,.8),transparent 44%),conic-gradient(from 0deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));animation:orbSpin 7s linear infinite}
#voiceFab::after{inset:-7px;border:1.5px solid rgba(120,170,255,.55);box-shadow:0 0 18px rgba(91,140,255,.6),inset 0 0 14px rgba(91,140,255,.35);animation:haloPulse 3s ease-in-out infinite}
#voiceFab:hover{transform:scale(1.07)}
#voiceFab.active{animation:none;box-shadow:0 0 40px rgba(47,224,255,.7),0 0 90px rgba(240,79,208,.45)}
#voiceFab.active::before{animation-duration:2.2s}
#voiceFab.active::after{animation-duration:1.2s;border-color:rgba(47,224,255,.8)}
#voiceFab:disabled{opacity:.5;filter:grayscale(.6)}

/* ---------- voice: panel with big orb + light-ribbon wave ---------- */
#voicePanel{width:320px;border-radius:26px;padding:18px 18px 16px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--solid) 80%,transparent),color-mix(in srgb,#000 70%,transparent));border:1px solid rgba(120,150,255,.2)}
[data-theme=light] #voicePanel{background:linear-gradient(180deg,rgba(14,16,40,.92),rgba(3,4,12,.96));color:#EEF0FF}
[data-theme=light] #voicePanel #voiceStatus,[data-theme=light] #voicePanel .voiceHint{color:#9AA0CC}
.voiceHead{justify-content:center;font-weight:650;letter-spacing:.01em}
.voiceOrb{width:9px;height:9px;background:var(--g5);box-shadow:0 0 10px var(--g5);animation:haloPulse 2s ease-in-out infinite}
.voiceStage{position:relative;height:200px;margin:4px 0 2px;display:flex;align-items:center;justify-content:center}
.vOrb{position:relative;width:118px;height:118px;border-radius:50%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vOrb i{position:absolute;inset:0;border-radius:50%}
.vOrb i:nth-child(1){background:radial-gradient(circle at 50% 50%,#020414 30%,transparent 62%),conic-gradient(from 0deg,#1E5BFF,#2FE0FF,#7B4DFF,#F04FD0,#1E5BFF);filter:blur(1px);animation:orbSpin 6s linear infinite}
.vOrb i:nth-child(2){inset:6px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75) 0 4%,transparent 22%),radial-gradient(circle at 65% 70%,rgba(240,79,208,.75),transparent 45%),radial-gradient(circle at 30% 70%,rgba(47,224,255,.7),transparent 45%),radial-gradient(circle,rgba(30,70,255,.85),rgba(10,15,70,.95));mix-blend-mode:screen;animation:orbSpinBack 9s linear infinite}
.vOrb i:nth-child(3){inset:-10px;background:radial-gradient(circle,transparent 56%,rgba(80,140,255,.55) 63%,rgba(47,224,255,.25) 67%,transparent 74%);filter:blur(2px);animation:haloPulse 3.2s ease-in-out infinite}
.vOrb::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.45),rgba(123,77,255,.18) 45%,transparent 70%);filter:blur(8px);z-index:-1;animation:haloPulse 4s ease-in-out infinite}
.vWave{position:absolute;left:0;right:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);top:50%;height:120px;transform:translateY(-50%);opacity:0;transition:opacity .45s;pointer-events:none;-webkit-box-reflect:below -28px linear-gradient(transparent 55%,rgba(255,255,255,.22))}
.vWave svg{width:100%;height:100%;overflow:hidden;filter:drop-shadow(0 0 6px rgba(120,120,255,.9)) drop-shadow(0 0 16px rgba(240,79,208,.5))}
.vWave path{fill:none;stroke-linecap:round;mix-blend-mode:screen;animation:waveRun 3.2s linear infinite;transform-box:view-box}
.vWave path:nth-child(2){animation-duration:4.1s}.vWave path:nth-child(3){animation-duration:2.6s}.vWave path:nth-child(4){animation-duration:5s}.vWave path:nth-child(5){animation-duration:3.6s}
.vWave g{transform-origin:50% 50%;transform-box:view-box;animation:waveAmp 1.1s ease-in-out infinite}
@keyframes waveRun{to{transform:translateX(-200px)}}
@keyframes waveAmp{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.15)}}
/* states (set on #voiceDock by JS) */
#voiceDock[data-state=listening] .vOrb{transform:scale(1.08)}
#voiceDock[data-state=listening] .vOrb i:nth-child(1){animation-duration:2.4s}
#voiceDock[data-state=listening] .vOrb i:nth-child(3){animation-duration:1s}
#voiceDock[data-state=thinking] .vOrb i:nth-child(1){animation-duration:1.1s}
#voiceDock[data-state=thinking] .vOrb i:nth-child(2){animation-duration:1.8s;filter:hue-rotate(40deg)}
#voiceDock[data-state=thinking] .vOrb{animation:orbBreath 1.2s ease-in-out infinite}
#voiceDock[data-state=speaking] .vOrb{transform:scale(.62);opacity:.9}
#voiceDock[data-state=speaking] .vWave{opacity:1}
#voiceStatus{font-size:14px;font-weight:550;color:var(--ink);margin:4px 0 12px;letter-spacing:.01em}
#voiceDock[data-state=listening] #voiceStatus{color:var(--g5);text-shadow:0 0 12px rgba(47,224,255,.6)}
#voiceDock[data-state=thinking] #voiceStatus{background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 2s linear infinite}
.voiceLangRow{justify-content:center}
.voiceLang{border-color:rgba(130,145,255,.25);color:#9AA0CC;border-radius:99px;padding:5px 14px}
.voiceLang.on{background:var(--gradCool);border-color:transparent;color:#fff;box-shadow:0 0 14px rgba(70,120,255,.55)}

/* ---------- scrollbars ---------- */
*{scrollbar-width:thin;scrollbar-color:rgba(120,140,255,.28) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(120,140,255,.28);border-radius:99px}::-webkit-scrollbar-track{background:transparent}

/* ---------- reduced motion: keep the look, stop the movement ---------- */
@media(prefers-reduced-motion:reduce){
  body::before,body::after,.orb,#empty::before,.heroGlow::after,#empty h1,.primary,.go,#voiceFab::before,#voiceFab::after,.vOrb,.vOrb i,.vOrb::after,.vWave path,.vWave g,#scope::before,.voiceOrb,.mic.listening,#voiceStatus{animation:none!important}
}
/* =================== VERITY "WOW 2" — cinematic layer =================== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
[data-theme=dark]{--formBg:#0B0D21}
[data-theme=light]{--formBg:#FFFFFF}
@keyframes spinAng{to{--ang:360deg}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shimmerText{to{background-position:-200% 0}}

/* living particle orb (canvas) replaces the CSS hero sphere */
#empty.hasOrb::before{display:none}
.heroOrb{width:250px;height:250px;margin:-30px 0 -22px;flex:none;cursor:grab;image-rendering:auto}
.heroOrb:active{cursor:grabbing}
/* staggered entrance of the home screen */
#empty>*{animation:riseIn .8s cubic-bezier(.2,.8,.2,1) backwards}
#empty>*:nth-child(2){animation-delay:.08s}#empty>*:nth-child(3){animation-delay:.16s}#empty>*:nth-child(4){animation-delay:.26s}#empty>*:nth-child(5){animation-delay:.36s}#empty>*:nth-child(6){animation-delay:.44s}
.caps .cap{animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both}
.caps .cap:nth-child(1){animation-delay:.3s}.caps .cap:nth-child(2){animation-delay:.38s}.caps .cap:nth-child(3){animation-delay:.46s}.caps .cap:nth-child(4){animation-delay:.54s}

/* cursor spotlight on cards and chips */
.cap::after,.src::after,.newChatSide::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(120,150,255,.22),transparent 60%)}
.src,.newChatSide{position:relative;overflow:hidden}
.cap:hover::after,.src:hover::after,.newChatSide:hover::after{opacity:1}
/* soft light that follows the mouse across the space background */
#cursorGlow{position:fixed;left:0;top:0;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(70,110,255,.13),rgba(123,77,255,.06) 40%,transparent 70%);transition:opacity .4s;will-change:transform}
[data-theme=light] #cursorGlow{background:radial-gradient(circle,rgba(70,110,255,.10),transparent 65%)}

/* messages float in */
.m{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both}
/* AI "thinking" indicator with live pipeline steps */
.thinking{display:inline-flex;align-items:center;gap:12px;font:500 15px var(--sans);padding:8px 16px 8px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 0 30px rgba(70,110,255,.15)}
[dir=rtl] .thinking{padding:8px 8px 8px 16px}
.tOrb{position:relative;width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 7%,transparent 26%),radial-gradient(circle at 72% 70%,rgba(240,79,208,.9),transparent 48%),radial-gradient(circle at 24% 76%,rgba(47,224,255,.85),transparent 46%),conic-gradient(from 0deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));box-shadow:0 0 16px rgba(70,120,255,.8);animation:orbSpin 1.4s linear infinite,orbBreath 1.4s ease-in-out infinite}
.tText{background:linear-gradient(90deg,var(--mute) 0%,var(--mute) 35%,#fff 50%,var(--mute) 65%,var(--mute) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmerText 1.8s linear infinite}
[data-theme=light] .tText{background-image:linear-gradient(90deg,var(--mute) 0%,var(--mute) 35%,var(--g2) 50%,var(--mute) 65%,var(--mute) 100%)}
.tText.swap{animation:shimmerText 1.8s linear infinite,riseIn .4s ease both}
.bot.typing:has(.thinking)::after{display:none}
/* finished answer gets one aurora light sweep */
.bot{position:relative}
.bot.revealed::before{content:"";position:absolute;inset:-6px -14px;border-radius:18px;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(91,140,255,.16) 45%,rgba(240,79,208,.14) 55%,transparent 70%);background-size:250% 100%;animation:sweep 1.3s ease-out both}
@keyframes sweep{from{background-position:120% 0;opacity:1}to{background-position:-60% 0;opacity:0}}

/* composer: solid inner so the rim stays a thin line; spinning aurora rim while the AI works */
#form{background:linear-gradient(var(--formBg),var(--formBg)) padding-box,linear-gradient(120deg,rgba(91,140,255,.55),rgba(123,77,255,.3),rgba(240,79,208,.45)) border-box}
#form:has(.go.stop){border-width:1.5px;background:linear-gradient(var(--formBg),var(--formBg)) padding-box,conic-gradient(from var(--ang),#2F6BFF,#2FE0FF,#7B4DFF,#F04FD0,#FFB547,#2F6BFF) border-box;animation:spinAng 2.2s linear infinite;box-shadow:var(--shadow),0 0 50px rgba(123,77,255,.35),0 0 90px rgba(47,107,255,.2)}

/* cinematic intro */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 45%,#0A1240 0%,#03040B 60%);cursor:pointer;animation:introOut .9s ease 2.3s forwards}
#intro .iOrb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 5%,transparent 22%),radial-gradient(circle at 66% 66%,rgba(240,79,208,.85),transparent 42%),radial-gradient(circle at 30% 70%,rgba(47,224,255,.8),transparent 40%),conic-gradient(from 90deg,#1A3DFF,#6A3BFF,#F04FD0,#2FE0FF,#1A3DFF);box-shadow:0 0 60px rgba(47,107,255,.8),0 0 160px rgba(123,77,255,.5),inset 0 0 30px rgba(255,255,255,.35);animation:introOrb 1.4s cubic-bezier(.2,.9,.2,1) both,orbSpin 6s linear infinite}
#intro .iName{font:700 64px/1 var(--sans);letter-spacing:.5em;color:#EEF0FF;text-indent:.5em;opacity:0;animation:introName 1.3s cubic-bezier(.2,.8,.2,1) .45s forwards;text-shadow:0 0 30px rgba(91,140,255,.7)}
#intro .iTag{font:500 16px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#9DB0FF;opacity:0;animation:riseIn .9s ease 1.05s forwards}
[dir=rtl] #intro .iTag{letter-spacing:0}
@keyframes introOrb{from{transform:scale(.1);opacity:0;filter:blur(12px)}60%{opacity:1}to{transform:scale(1);opacity:1;filter:none}}

/* =================== VERITY "WOW 3" — signature features =================== */
/* ---- Proof Beam ---- */
#beamLayer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90;overflow:visible}
mark.ignite{animation:ignite 1.6s ease-out}
@keyframes ignite{0%{box-shadow:0 0 0 0 rgba(255,181,71,.9),0 0 0 0 rgba(240,79,208,.6);filter:brightness(1.8)}35%{box-shadow:0 0 0 6px rgba(255,181,71,.35),0 0 40px 12px rgba(240,79,208,.45);filter:brightness(1.3)}100%{box-shadow:0 0 0 1px rgba(255,181,71,.55),0 0 22px rgba(255,181,71,.35);filter:none}}

/* ---- Truth Score ring ---- */
.truth{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px 3px 4px;font:600 12px var(--sans);color:var(--ink);backdrop-filter:blur(12px);transition:box-shadow .2s,border-color .2s}

.truth:hover{border-color:var(--tc);box-shadow:0 0 18px color-mix(in srgb,var(--tc) 45%,transparent)}
.truth svg{width:28px;height:28px;transform:rotate(-90deg);flex:none;overflow:visible}
.truth .bg{fill:none;stroke:var(--line);stroke-width:3.5}
.truth .fg{fill:none;stroke:var(--tc);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:69.1;stroke-dashoffset:69.1;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px var(--tc))}
.truth .num{font-variant-numeric:tabular-nums;color:var(--tc)}
.truth .lbl{color:var(--mute);font-weight:500}

/* ---- voice orb reacts to your real voice (--lvl = 0..1 loudness) ---- */
#voiceDock{--lvl:0}
.vOrb{scale:calc(1 + var(--lvl) * .32);transition:transform .5s cubic-bezier(.2,.8,.2,1),scale .08s linear}
.vOrb i:nth-child(3){scale:calc(1 + var(--lvl) * .55)}
.vOrb::after{scale:calc(1 + var(--lvl) * .7)}
.vWave svg{transform:scaleY(calc(.45 + var(--lvl) * 1.25));transition:transform .08s linear}
#voiceFab.active{scale:calc(1 + var(--lvl) * .14)}
.vMeter{display:flex;justify-content:center;gap:4px;height:18px;align-items:center;margin:-4px 0 8px}
.vMeter span{width:4px;border-radius:4px;background:linear-gradient(var(--g5),var(--g2));height:calc(4px + var(--lvl) * var(--h,14px));opacity:calc(.35 + var(--lvl));transition:height .08s linear}
.vMeter span:nth-child(1),.vMeter span:nth-child(7){--h:6px}.vMeter span:nth-child(2),.vMeter span:nth-child(6){--h:10px}.vMeter span:nth-child(3),.vMeter span:nth-child(5){--h:14px}.vMeter span:nth-child(4){--h:18px}

/* api + toast */
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(tr(j.detail||r.statusText))}return r.json()}

const post=(u,b,m='POST')=>api(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});

/* library */
async function load(){lib=await api('/api/library');if(scopeDoc&&!lib.docs[scopeDoc])scopeDoc=null;updateScopeLabel();renderLib();renderEmpty()}
function updateScopeLabel(){
  updateDocumentActions();
  if(scopeDoc&&lib.docs[scopeDoc]) $('#scope').textContent=local(`Searching only ${lib.docs[scopeDoc].name}`,`البحث فقط في ${lib.docs[scopeDoc].name}`);
  else if(scope) $('#scope').textContent=local(`Searching in ${scope}`,`البحث في ${scope}`);
  else $('#scope').textContent=tr("Searching all documents");
}
function setScope(f){$('#libraryClose').click();scope=f;scopeDoc=null;updateScopeLabel();renderLib()}
function setDocScope(id){$('#libraryClose').click();scopeDoc=id;scope=null;updateScopeLabel();renderLib()}

function inferDocumentScope(question){
  const q=normalizeSearch(question||'');
  const matches=[];
  for(const d of Object.values(lib.docs)){
    const full=normalizeSearch(d.name||'');
    const stem=full.replace(/\.[^.]+$/,'');
    if(full&&q.includes(full))matches.push(d.id);
    else if(stem.length>=3&&q.includes(stem))matches.push(d.id);
  }
  return [...new Set(matches)];
}

function documentFolders(doc){const memberships=Array.isArray(doc.folders)?doc.folders:[];const valid=memberships.filter(f=>typeof f==='string'&&f.trim());return valid.length?valid:[typeof doc.folder==='string'&&doc.folder.trim()?doc.folder:'General']}
function renderLib(){
  const box=$('#lib');box.replaceChildren();
  const all=el('button','item'+(scope===null&&!scopeDoc&&!favoritesOnly?' on':''),tr("All documents"));all.dataset.libraryFilter='all';all.onclick=()=>{favoritesOnly=false;scope=null;scopeDoc=null;updateScopeLabel();renderLib()};box.append(all);
  const fav=el('button','item'+(favoritesOnly?' on':''),tr('Favorites'));fav.onclick=()=>{favoritesOnly=!favoritesOnly;renderLib()};box.append(fav);
  if(favoritesOnly&&!Object.values(lib.docs).some(d=>d.starred))box.append(el('div','cnt',tr('No favorite documents yet.')));
  // Build from canonical memberships too, so older libraries cannot hide files.
  const folders=[...new Set([...lib.folders,...Object.values(lib.docs).flatMap(documentFolders)])];
  for(const f of folders){
    const docs=Object.values(lib.docs).filter(d=>documentFolders(d).includes(f)&&(!favoritesOnly||d.starred));
    const wrap=el('div','folder'+(scope===f?' on':''));
    const head=el('div','fhead');
    const nm=el('button','fname',f==='General'?tr('General'):f);nm.onclick=()=>setScope(f);
    head.append(nm,el('span','cnt',String(docs.length)));
    if(f!=='General'){const x=el('button','x','\u00d7');x.title=tr("Delete folder (documents move to General)");x.setAttribute('aria-label',local('Delete folder '+f,'حذف المجلد '+f));
      x.onclick=async()=>{if(confirm(local(`Delete folder "${f}"? Its documents move to General.`,`حذف المجلد «${f}»؟ تُنقل مستنداته إلى عام.`))){if(scope===f)setScope(null);lib=await api('/api/folders/'+encodeURIComponent(f),{method:'DELETE'});await load()}};head.append(x)}
    wrap.append(head);

/* speech output (voice chat + Listen button): the server's TTS, Agent/voice.py */
let speakToken=0,player=null;
function stopSpeaking(){
  speakToken++;
  if(player){try{player.pause()}catch{}player=null}
  isSpeaking=false;
}
async function speakText(text,onDone){
  stopSpeaking();
  const my=speakToken;
  if(!text){onDone?.();return}
  isSpeaking=true;
  const finish=()=>{if(my!==speakToken)return;isSpeaking=false;player=null;onDone?.()};
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(my!==speakToken)return;
    if(!r.ok||r.status===204){finish();return}
    const url=URL.createObjectURL(await r.blob());
    if(my!==speakToken){URL.revokeObjectURL(url);return}
    player=new Audio(url);
    player.onended=player.onerror=()=>{URL.revokeObjectURL(url);finish()};
    await player.play();
  }catch{finish()}
}

/* split-screen viewer */

/* The extracted text is for reading/searching, not for reproducing PDF layout.
   Some PDFs store every word as a separate positioned object, which can make
   extracted text appear vertically. Clean only the DISPLAY copy here; the
   indexed/source text and character offsets remain untouched. */
function readableText(s){
  if(!s)return '';

  let x=s.replace(/\r/g,'');

  // Preserve likely paragraph breaks, but turn single line breaks into spaces.
  x=x.replace(/\n[ \t]*\n+/g,'\n\n');
  x=x.replace(/(?<![.!?:;\u061f])\n(?=\S)/g,' ');
  x=x.replace(/[ \t]{2,}/g,' ');

  // If a PDF extraction produced lots of one-word lines, collapse those too.
  const lines=x.split('\n');
  const nonempty=lines.filter(v=>v.trim());
  const short=nonempty.filter(v=>v.trim().split(/\s+/).length<=3);
  if(nonempty.length>=8 && short.length/nonempty.length>.65){
    x=x.replace(/\s+/g,' ');
  }

  return x.trim();
}

/* Record one utterance -> Blob, or null when nothing was said / it was cancelled. */
async function recordOnce(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
  const data=new Uint8Array(an.fftSize),parts=[],mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  return new Promise(resolve=>{
    let heard=false,quietSince=0,cancelled=false,timer=0;const started=performance.now();
    mr.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());ctx.close().catch(()=>{});
      resolve(cancelled||!heard?null:new Blob(parts,{type:mr.mimeType||'audio/webm'}))};
    rec={stop(send=true){cancelled=!send;if(mr.state!=='inactive')mr.stop()}};
    mr.start(250);
    timer=setInterval(()=>{
      an.getByteTimeDomainData(data);let sum=0;for(const v of data){const x=(v-128)/128;sum+=x*x}
      const now=performance.now();
      if(Math.sqrt(sum/data.length)>0.02){heard=true;quietSince=0}
      else if(heard){quietSince=quietSince||now;if(now-quietSince>1200)rec.stop(true)}
      if(now-started>30000||(!heard&&now-started>12000))rec.stop(true);
    },100);
  });
}

    try{q=await transcribeBlob(blob)}catch(e){toast(e.message)}

  },delay);
}

<script>

(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const AR_UI=()=>document.documentElement.lang==='ar'||document.documentElement.dir==='rtl'||(typeof uiLang!=='undefined'&&uiLang==='ar');

  i.innerHTML='<div class="iOrb"></div><div class="iName">Verity</div><div class="iTag"></div>';

  i.onclick=done;
  document.body.append(i);
  try{sessionStorage.setItem('verity-intro','1')}catch{}
}

/* ---- 2. cursor glow + spotlight on cards ---- */
if(!reduce){
  const g=document.createElement('div');g.id='cursorGlow';document.body.append(g);
  let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y,raf=0;
  const loop=()=>{x+=(tx-x)*.12;y+=(ty-y)*.12;g.style.transform=`translate(${x}px,${y}px)`;raf=(Math.abs(tx-x)+Math.abs(ty-y)>.5)?requestAnimationFrame(loop):0};
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(!raf)raf=requestAnimationFrame(loop);
    const c=e.target.closest?.('.cap,.src,.newChatSide');
    if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}
  },{passive:true});
}

/* ---- 3. live "thinking" steps, driven by the real answer pipeline ---- */
const STEPS={
  'Searching…':['Searching your documents…','أبحث في مستنداتك…'],
  'Evidence found':['Found the evidence…','وجدتُ الدليل…'],
  'Hybrid retrieval ✓':['Ranking the best passages…','أرتّب أفضل المقاطع…'],
  'Evidence verified ✓':['Checking the facts…','أتحقق من المعلومات…']
};
const DEFAULT=['Thinking…','أفكر…'];
let step=DEFAULT;
const stepText=()=>step[AR_UI()?1:0];
const oldPipe=typeof setPipeline==='function'?setPipeline:()=>{};
setPipeline=function(label,active){
  try{oldPipe.apply(this,arguments)}catch{}
  if(active===false){step=DEFAULT;return}
  if(STEPS[label])step=STEPS[label];
  document.querySelectorAll('.thinking .tText').forEach(t=>{if(t.textContent!==stepText()){t.textContent=stepText();t.classList.remove('swap');void t.offsetWidth;t.classList.add('swap')}});
};
function addThinking(b){
  if(b.childNodes.length)return;
  const w=document.createElement('div');w.className='thinking';
  const o=document.createElement('span');o.className='tOrb';
  const t=document.createElement('span');t.className='tText';t.textContent=stepText();
  w.append(o,t);b.append(w);
}
const msgs=document.getElementById('msgs');
if(msgs){
  new MutationObserver(muts=>{
    for(const m of muts){
      if(m.type==='attributes'){
        const b=m.target;
        if(b.classList?.contains('bot')){
          if(b.classList.contains('typing'))addThinking(b);
          else if((m.oldValue||'').includes('typing')){b.classList.remove('revealed');void b.offsetWidth;b.classList.add('revealed');setTimeout(()=>b.classList.remove('revealed'),1400)}
        }
      }else{
        if(m.target.classList?.contains('bot')&&m.target.classList.contains('typing'))addThinking(m.target);
        m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.id==='empty')mountOrb(n)});
      }
    }
  }).observe(msgs,{subtree:true,childList:true,attributes:true,attributeFilter:['class'],attributeOldValue:true});
}

/* ---- 4. living particle orb on the home screen ---- */
let orbState={speed:1};
function mountOrb(empty){
  if(empty.querySelector('.heroOrb'))return;
  const cv=document.createElement('canvas');cv.className='heroOrb';cv.setAttribute('aria-hidden','true');
  empty.prepend(cv);empty.classList.add('hasOrb');

let beamFrom=null,beamAt=0;

    ctx.globalCompositeOperation='lighter';
    for(const s of stars){
      const lit=u.has(s.id),hov=hover===s,tw=.75+.25*Math.sin(t*2+s.ph);
      const R=s.r*(lit?1.7:hov?1.5:1);
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R*(lit?7:4.5));g.addColorStop(0,s.col);g.addColorStop(.3,s.col+'88');g.addColorStop(1,s.col+'00');
      ctx.globalAlpha=(lit?1:.75)*tw;ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,R*(lit?7:4.5),0,6.283);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,R*.55,0,6.283);ctx.fill();
      if(lit){const k=(t*.8+s.ph)%1;ctx.strokeStyle='#FFE3AE';ctx.globalAlpha=(1-k)*.8;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(s.x,s.y,R*2+k*18,0,6.283);ctx.stroke()}
    }
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    raf=reduce?0:requestAnimationFrame(draw);
  }
  function pick(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=14;for(const s of stars){const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;best=s}}return best}
  cv.addEventListener('pointermove',e=>{hover=pick(e);cv.classList.toggle('hot',!!hover);
    if(hover){tip.hidden=false;tip.replaceChildren(mk('span',null,hover.name),mk('small',null,`${hover.folder} · ${hover.pages} ${L(hover.pages===1?'page':'pages','صفحة')}`));tip.style.left=hover.x+'px';tip.style.top=hover.y+'px'}else tip.hidden=true;
    if(reduce)draw(performance.now())});
  cv.addEventListener('pointerleave',()=>{hover=null;tip.hidden=true});
  cv.addEventListener('click',e=>{const s=pick(e);if(s&&typeof openDoc==='function')openDoc(s.id)});
  const start=()=>{if(!lp.hidden&&!raf)raf=requestAnimationFrame(draw)};
  new MutationObserver(start).observe(lp,{attributes:true,attributeFilter:['hidden']});
  const baseRender=renderLib;renderLib=function(){const r=baseRender.apply(this,arguments);key='';start();return r};
  start();
}
})();
</script>
<script>
/* performance: mark the page busy while an answer is generating */
(()=>{const b=setBusy;setBusy=function(v){const r=b.apply(this,arguments);document.body.classList.toggle('aiBusy',!!v);return r}})();
</script>
<script>
/* "bing" chime when an answer starts to appear (made with Web Audio, no sound file needed) */
(()=>{
const SOUND_ON=true;            /* set to false to turn the chime off */
let ac=null;
const unlock=()=>{try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch{}};
addEventListener('pointerdown',unlock,{capture:true});addEventListener('keydown',unlock,{capture:true});
function chime(){
  if(!SOUND_ON||!ac)return;
  const t=ac.currentTime+.02,out=ac.createGain();out.gain.value=.55;
  const dl=ac.createDelay();dl.delayTime.value=.13;const fb=ac.createGain();fb.gain.value=.22;const wet=ac.createGain();wet.gain.value=.35;
  dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);out.connect(ac.destination);
  [[1318.5,0,.20],[1975.5,.09,.16]].forEach(([f,d,v])=>{
    [[1,v,1.3],[2.76,v*.18,.45],[5.4,v*.06,.25]].forEach(([m,g,len])=>{
      const o=ac.createOscillator(),e=ac.createGain();o.type='sine';o.frequency.value=f*m;
      e.gain.setValueAtTime(0,t+d);e.gain.linearRampToValueAtTime(g,t+d+.006);e.gain.exponentialRampToValueAtTime(.0001,t+d+len);
      o.connect(e);e.connect(out);e.connect(dl);o.start(t+d);o.stop(t+d+len+.05);
    });
  });
}
const msgs=document.getElementById('msgs');
if(msgs)new MutationObserver(()=>{
  if(typeof busy==='undefined'||!busy||(typeof voiceChat!=='undefined'&&voiceChat))return;
  const b=[...msgs.querySelectorAll('.bot')].pop();
  if(!b||b.dataset.chimed||b.querySelector('.thinking'))return;
  if((b.textContent||'').trim().length>1){b.dataset.chimed='1';chime()}
}).observe(msgs,{childList:true,subtree:true,characterData:true});
window.verityChime=()=>{unlock();chime()};
})();
</script>
