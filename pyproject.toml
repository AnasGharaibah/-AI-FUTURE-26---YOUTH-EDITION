[project]
name = "yoth-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AnasGharaibah", email = "anasgh005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "marker-pdf>=1.10.2",
    "markitdown[all]>=0.1.5",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "openai-whisper>=20250625; sys_platform != 'darwin'",
    "av>=14.0.0; sys_platform != 'darwin'",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "psutil>=7.2.2",
]

[project.scripts]
yoth-ai = "yoth_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
